[project]
name = "monocon-metis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numba>=0.66.0",
    "numpy<2",
    "onnx==1.17.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "tqdm>=4.68.3",
    "yacs>=0.1.8",
]
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true